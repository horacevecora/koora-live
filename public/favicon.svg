<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e676" />
      <stop offset="100%" stop-color="#00c853" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="100%" stop-color="#00b0ff" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10" />
      <feOffset dx="0" dy="10" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.5" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- الخطوط الديناميكية الخلفية -->
  <g opacity="0.8">
    <rect x="50" y="280" width="200" height="25" rx="12.5" fill="url(#greenGrad)" transform="rotate(-15 50 280)" />
    <rect x="60" y="320" width="180" height="20" rx="10" fill="url(#greenGrad)" transform="rotate(-15 60 320)" />
    <rect x="300" y="150" width="180" height="25" rx="12.5" fill="url(#blueGrad)" transform="rotate(-15 300 150)" />
    <rect x="320" y="190" width="150" height="20" rx="10" fill="url(#blueGrad)" transform="rotate(-15 320 190)" />
  </g>

  <!-- الدرع الرئيسي -->
  <path d="M256 40 L420 120 V320 L256 440 L92 320 V120 L256 40Z" fill="url(#shieldGrad)" stroke="white" stroke-width="15" filter="url(#shadow)" />
  
  <!-- كرة القدم -->
  <g transform="translate(256, 180)">
    <circle r="110" fill="white" stroke="#0f172a" stroke-width="2" />
    <path d="M0 -110 L25 -70 H-25 L0 -110Z" fill="#0f172a" />
    <path d="M0 0 L40 -30 L30 -80 L-30 -80 L-40 -30 Z" fill="#0f172a" transform="translate(0, -20)" />
    <path d="M80 20 L110 0 L100 -50 L60 -40 Z" fill="#0f172a" />
    <path d="M-80 20 L-110 0 L-100 -50 L-60 -40 Z" fill="#0f172a" />
    <path d="M40 70 L80 50 L90 10 L50 20 Z" fill="#0f172a" />
    <path d="M-40 70 L-80 50 L-90 10 L-50 20 Z" fill="#0f172a" />
    <path d="M0 110 L30 80 H-30 Z" fill="#0f172a" />
  </g>

  <!-- نص LIVE والزر -->
  <rect x="140" y="310" width="232" height="80" rx="20" fill="white" filter="url(#shadow)" />
  <text x="256" y="365" font-family="Arial" font-weight="900" font-size="60" fill="#0f172a" text-anchor="middle">LIVE</text>
  
  <!-- زر التشغيل الصغير -->
  <circle cx="380" cy="350" r="45" fill="url(#greenGrad)" stroke="white" stroke-width="8" />
  <path d="M370 330 L400 350 L370 370 Z" fill="white" />
</svg>